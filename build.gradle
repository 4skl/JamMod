subprojects {
    apply plugin: 'java'

    if (project.path.matches('^:[0-9].*')) {
        tasks.withType(JavaCompile).configureEach {
            dependsOn ':lavaplayer-bundle:shadowJar'
        }
    }

    group = 'com.skl'
    version = rootProject.findProperty('mod_version') ?: '1.0.0'

    tasks.named('jar', Jar) {
        manifest {
            attributes([
                    'Specification-Title'     : rootProject.findProperty('mod_id') ?: 'jammod',
                    'Specification-Vendor'    : rootProject.findProperty('mod_authors') ?: '4skl',
                    'Specification-Version'   : '1',
                    'Implementation-Title'    : rootProject.findProperty('mod_name') ?: project.name,
                    'Implementation-Version'  : project.version,
                    'Implementation-Vendor'   : rootProject.findProperty('mod_authors') ?: '4skl',
                    'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
            ])
        }
    }
}

gradle.projectsEvaluated {
    subprojects {
        if (project.path.matches('^:[0-9].*')) {
            // Ensure resources are processed before compilation and dev runs
            tasks.matching { it.name == 'compileJava' }.configureEach {
                dependsOn tasks.named('processResources')
            }
            tasks.matching { it.name.startsWith('run') }.configureEach {
                dependsOn tasks.named('processResources')
            }

            // Centralized JAR naming from gradle.properties
            def modBaseName = rootProject.findProperty('mod_name') ?: rootProject.findProperty('mod_id') ?: 'JamMod'
            tasks.withType(AbstractArchiveTask).configureEach {
                archiveBaseName.set("${modBaseName}-${project.name}")
            }

            // Expand metadata placeholders in mods.toml, neoforge.mods.toml, and pack.mcmeta
            tasks.withType(ProcessResources).configureEach {
                def isForge = project.name.contains('forge') && !project.name.contains('neoforge')
                def isNeo = project.name.contains('neoforge')
                def mcVer = project.name.split('-')[0]

                def packFormat = [
                        '1.18.2': 9, '1.19.2': 10, '1.19.4': 12,
                        '1.20.1': 15, '1.20.4': 26, '1.21.1': 48
                ].get(mcVer, 15)

                def fmlRange = [
                        '1.18.2': '[40,)', '1.19.2': '[43,)', '1.19.4': '[45,)',
                        '1.20.1': '[47,)', '1.20.4': '[2,)',  '1.21.1': '[4,)'
                ].get(mcVer, '[1,)')

                def loaderRange = [
                        '1.18.2': '[40,)', '1.19.2': '[43,)', '1.19.4': '[45,)',
                        '1.20.1': '[47,)', '1.20.4': '[20.4,)', '1.21.1': '[21.1,)'
                ].get(mcVer, '[0,)')

                def id = rootProject.findProperty('mod_id') ?: 'jammod'
                def name = rootProject.findProperty('mod_name') ?: 'JamMod'
                def ver = rootProject.findProperty('mod_version') ?: '1.0.0'
                def license = rootProject.findProperty('mod_license') ?: 'MIT'
                def authors = rootProject.findProperty('mod_authors') ?: '4skl'
                def description = rootProject.findProperty('mod_description') ?: ''

                var replaceProperties = [
                        'mod_id'                 : id,
                        'modId'                  : id,
                        'mod_name'               : name,
                        'displayName'            : name,
                        'mod_version'            : ver,
                        'version'                : ver,
                        'mod_license'            : license,
                        'license'                : license,
                        'mod_authors'            : authors,
                        'authors'                : authors,
                        'mod_description'        : description,
                        'description'            : description,
                        'pack_format'            : packFormat,
                        'minecraft_version'      : mcVer,
                        'minecraft_version_range': "[${mcVer}]",
                        'fml_version_range'      : fmlRange,
                        'loader_version_range'   : loaderRange,
                        'file'                   : ['jarVersion': ver]
                ]

                inputs.properties replaceProperties
                duplicatesStrategy = DuplicatesStrategy.INCLUDE

                if (isForge) exclude '**/neoforge.mods.toml'
                if (isNeo) exclude '**/mods.toml'

                eachFile { details ->
                    if (details.name in ['mods.toml', 'neoforge.mods.toml', 'pack.mcmeta']) {
                        details.expand(replaceProperties)
                    }
                }
            }
        }
    }
}