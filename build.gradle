plugins {
    id 'base'
}

subprojects {
    apply plugin: 'java'

    group = 'com.skl'
    version = '1.0.0'

    repositories {
        mavenCentral()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Minecraft'
            url = 'https://libraries.minecraft.net/'
        }
        maven { url = 'https://maven.lavalink.dev/releases' }
        maven { url = 'https://jitpack.io' }
    }
}
