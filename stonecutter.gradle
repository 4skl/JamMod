plugins {
    id 'dev.kikugie.stonecutter'
}

stonecutter.active "1.20.1-forge" /* [SC] DO NOT EDIT */

// Standard Groovy task that triggers 'build' across all version subprojects
tasks.register("buildAll") {
    group = "project"
    dependsOn subprojects.collect { p -> p.tasks.matching { t -> t.name == "build" } }
}