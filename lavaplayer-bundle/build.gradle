plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.skl'
version = '2.2.2'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
    maven { url = 'https://maven.lavalink.dev/releases' }
    maven { url = 'https://jitpack.io' }
}

// Private configuration: bundled into the shadowJar, but never leaked to consumers
configurations {
    shadowBundle {
        canBeConsumed = false
        canBeResolved = true
    }
    compileClasspath.extendsFrom shadowBundle
    runtimeClasspath.extendsFrom shadowBundle
}

dependencies {
    shadowBundle('dev.arbjerg:lavaplayer:2.2.2') {
        exclude group: 'org.jetbrains', module: 'annotations'
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    shadowBundle('dev.lavalink.youtube:common:1.18.2') {
        exclude group: 'org.jetbrains', module: 'annotations'
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }

    compileOnly 'org.jetbrains:annotations:24.0.1'
    compileOnly 'org.slf4j:slf4j-api:2.0.7'
}

tasks.named('jar') {
    enabled = false
}

shadowJar {
    archiveClassifier.set('')
    configurations = [project.configurations.shadowBundle]

    exclude 'org/intellij/**'
    exclude 'org/jetbrains/**'
    exclude 'org/slf4j/**'

    exclude 'module-info.class'
    exclude 'META-INF/versions/**'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

// Publish only the shaded jar
configurations {
    [apiElements, runtimeElements].each { conf ->
        conf.outgoing.artifacts.clear()
        conf.outgoing.artifact(tasks.shadowJar)
    }
}