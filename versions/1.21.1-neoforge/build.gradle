plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.78'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.65'
    runs {
        client {
            client()
            def user = project.findProperty('username') ?: rootProject.findProperty('username')
            if (user) {
                programArguments.addAll(['--username', user.toString()])
            }
        }
        server { server() }
    }
    mods {
        jammod { sourceSet sourceSets.main }
    }
}

dependencies {
    compileOnly(project(':lavaplayer-bundle')) { transitive = false }
    additionalRuntimeClasspath(project(':lavaplayer-bundle')) { transitive = false }

    jarJar(project(':lavaplayer-bundle')) {
        transitive = false
    }
}

def modBaseName = rootProject.findProperty('mod_name') ?: rootProject.findProperty('mod_id') ?: 'JamMod'

jar {
    archiveBaseName.set("${modBaseName}-${project.name}")
}

tasks.matching { it.name == 'runClient' }.configureEach {
    doFirst {
        def fmlCfg = project.file('run/config/fml.toml')
        if (fmlCfg.exists()) {
            fmlCfg.text = fmlCfg.text.replace('earlyWindowControl = true', 'earlyWindowControl = false')
        } else {
            fmlCfg.parentFile.mkdirs()
            fmlCfg.text = 'earlyWindowControl = false\n'
        }
    }
}