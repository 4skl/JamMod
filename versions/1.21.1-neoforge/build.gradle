plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.78'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        java {
            srcDir project(':common').file('src/main/java')
        }
        resources {
            srcDir project(':common').file('src/main/resources')
        }
    }
}

neoForge {
    version = '21.1.93'

    runs {
        client {
            client()
            def user = project.findProperty('username') ?: rootProject.findProperty('username')
            if (user) {
                programArguments.addAll(['--username', user.toString()])
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        jammod {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly(project(':lavaplayer-bundle')) { transitive = false }
    additionalRuntimeClasspath(project(':lavaplayer-bundle')) { transitive = false }
    jarJar(project(':lavaplayer-bundle')) { transitive = false }
}