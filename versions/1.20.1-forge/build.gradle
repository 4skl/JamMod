plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// 1. Enable Forge's Jar-in-Jar system before the minecraft block
jarJar.enable()

minecraft {
    mappings channel: 'official', version: '1.20.1'
    // Disabled so Gradle's processResources expansion is respected
    copyIdeResources = false

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${rootProject.findProperty('mod_id') ?: 'jammod'}" {
                    source sourceSets.main
                }
            }
        }
        client {
            def user = project.findProperty('username') ?: rootProject.findProperty('username')
            if (user) {
                args '--username', user.toString()
            }
        }
        server { args '--nogui' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'

    compileOnly(project(':lavaplayer-bundle')) { transitive = false }
    minecraftLibrary(project(':lavaplayer-bundle')) { transitive = false }

    jarJar(project(':lavaplayer-bundle')) {
        transitive = false
        jarJar.ranged(it, '[2.2.2,)')
    }
}

// 2. Reobfuscate the jarJar artifact from Mojang mappings to SRG for production
reobf {
    jarJar { }
}
tasks.jarJar.finalizedBy('reobfJarJar')

// 3. Centralized Output Naming: pulls 'mod_name' from gradle.properties
def modBaseName = rootProject.findProperty('mod_name') ?: rootProject.findProperty('mod_id') ?: 'JamMod'

tasks.jarJar.configure {
    archiveBaseName.set("${modBaseName}-${project.name}")
    archiveClassifier.set('')
}

jar {
    archiveBaseName.set("${modBaseName}-${project.name}")
    archiveClassifier.set('slim')
}