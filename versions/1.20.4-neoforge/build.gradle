plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.78'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        java {
            srcDir project(':common').file('src/main/java')
        }
    }
}

neoForge {
    version = '20.4.253'
    runs {
        client { client() }
        server { server() }
    }
    mods {
        jammod { sourceSet sourceSets.main }
    }
}

dependencies {
    // Compile against the bundled library and its exposed APIs
    compileOnly project(':lavaplayer-bundle')

    // Dev runtime classpath for NeoForge runs
    additionalRuntimeClasspath project(':lavaplayer-bundle')

    // Bundles lavaplayer-bundle into the final JAR for production
    jarJar project(':lavaplayer-bundle')
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'jammod',
                'Specification-Vendor'    : '4skl',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : '4skl',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}