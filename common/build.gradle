plugins {
    id 'java-library'
}

java {
    toolchain {
        // Java 17 ensures bytecode compatibility across 1.18.2–1.20.4 while running seamlessly on Java 21 in 1.21.1
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    // Bundled audio library (exposes LavaPlayer and Lavalink YouTube to consumers)
    api project(':lavaplayer-bundle')

    // Provided at runtime by Minecraft, Forge, and NeoForge
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly 'org.slf4j:slf4j-api:2.0.7'
}