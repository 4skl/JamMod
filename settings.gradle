pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.kikugie.dev/releases' }
        maven { url = 'https://maven.kikugie.dev/snapshots' }
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.7.10'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'JamMod'

include 'common'
include 'lavaplayer-bundle'

stonecutter {
    create(rootProject) {
        // Point each version node to its own build.gradle inside its versions/ folder
        versions(
                "1.18.2-forge",
                "1.19.2-forge",
                "1.19.4-forge",
                "1.20.1-forge",
                "1.20.4-neoforge",
                "1.21.1-neoforge"
        ).buildscript("build.gradle")

        vcsVersion = "1.20.1-forge"
    }
}

// Ensure Gradle maps each subproject directory to versions/<name>
rootProject.children.each { child ->
    def dir = file("versions/${child.name}")
    if (dir.exists()) {
        child.projectDir = dir
        child.buildFileName = "build.gradle"
    }
}